<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
}

/* Top Menu Bar */
.navbar {
    width: 100%;
    height: 80px;
    background: linear-gradient(to right, #182231, #2465ad);

    display: flex;
    align-items: center;
    padding: 0 30px;
}

/* Logo */
.logo {
    color: white;
    margin-right: 50px;
}

.logo h2 {
    font-size: 24px;
}

.logo p {
    font-size: 12px;
    color: #ddd;
}

/* Menu */
.menu {
    display: flex;
    gap: 10px;
}

.menu a {
    color: white;
    text-decoration: none;
    padding: 15px 20px;
    font-size: 16px;
}

.menu a:hover {
    background-color: rgba(255,255,255,0.15);
    border-radius: 5px;
}
</style>
<body>
    <div class="navbar">
    <div class="logo">
        <h2>Student Course</h2>
        <p>Course Management</p>
    </div>

    <div class="menu">
        <a href="http://127.0.0.1:8000/myapp/dashboard/"> Dashboard</a><br>

        <a href="http://127.0.0.1:8000/myapp/student/">Students</a><br>

        <a href="http://127.0.0.1:8000/myapp/course/">Courses</a><br>

        <a href="http://127.0.0.1:8000/myapp/instructor/">Instructors</a><br>

        <a href="http://127.0.0.1:8000/myapp/enrollment/">Enrollments</a><br>

        <a href="http://127.0.0.1:8000/myapp/material/">Materials</a><br>

        <a href="http://127.0.0.1:8000/myapp/signup/">Signup</a><br>

        <a href="http://127.0.0.1:8000/myapp/login/">Login</a><br>




    </div>
</div>



</body>
</html>
