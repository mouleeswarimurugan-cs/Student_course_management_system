<!DOCTYPE html>
<html>
<head>

    <title>Course Details</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .course-image {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .no-image {
            height: 300px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .content {
            padding: 30px;
        }

        h1 {
            color: #222;
            margin-bottom: 15px;
        }

        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .detail-box {
            background: #f8fafc;
            padding: 18px;
            border-radius: 10px;
        }

        .label {
            display: block;
            color: #888;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            font-size: 18px;
            font-weight: bold;
            color: #222;
        }

        .fees {
            color: #2563eb;
        }

        .buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            text-decoration: none;
            padding: 11px 20px;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .edit {
            background: #2563eb;
        }

        .delete {
            background: #dc2626;
        }

        .back {
            background: #64748b;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        {% if course.cou_image %}

            <img src="{{ course.cou_image.url }}"
                 class="course-image"
                 alt="{{ course.course_name }}">

        {% else %}

            <div class="no-image">
                No Course Image
            </div>

        {% endif %}


        <div class="content">

            <h1>{{ course.course_name }}</h1>

            <p class="description">
                {{ course.description }}
            </p>


            <div class="details">

                <div class="detail-box">

                    <span class="label">
                        Duration
                    </span>

                    <span class="value">
                        {{ course.duration }}
                    </span>

                </div>


                <div class="detail-box">

                    <span class="label">
                        Course Fees
                    </span>

                    <span class="value fees">
                        ₹{{ course.fees }}
                    </span>

                </div>

            </div>


            <div class="buttons">

                <a href="{% url 'course_update' course.id %}"
                   class="btn edit">
                    Edit
                </a>

                <a href="{% url 'course_delete' course.id %}"
                   class="btn delete">
                    Delete
                </a>

                <a href="{% url 'course_list' %}"
                   class="btn back">
                    Back
                </a>

            </div>

        </div>

    </div>

</div>

</body>
</html>
