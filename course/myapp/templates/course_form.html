<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Form</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            
        }

        
        
        

        /* Heading */

        .heading {
            text-align: center;
            margin-bottom: 25px;
        }

        .from-card h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 8px;
        }

        

        /* Form Card */

        .form-card {
            width: 500px;
            margin: 50px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        /* Django form */

        form p {
            margin-bottom: 20px;
        }

        form label {
            display: block;
            color: #333;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        form textarea {
            min-height: 100px;
            resize: vertical;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        /* File input */

        form input[type="file"] {
            padding: 10px;
            background: #f8fafc;
        }

        /* Buttons */

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
        }

        .save-btn:hover {
            background: #3730a3;
        }

        .back-btn {
            background: #e5e7eb;
            color: #333;
        }

        .back-btn:hover {
            background: #d1d5db;
        }
        

        /* Error */

        .errorlist {
            color: #dc2626;
            font-size: 13px;
            margin-top: 5px;
            list-style: none;
        }

        /* Responsive */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .form-card {
                padding: 25px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>
    {% include 'base.html'%}

<div class="container">

   

    <!-- Form -->

    <div class="form-card">

        <form method="POST" enctype="multipart/form-data">
             <h1><center>Add Course</center></h1><br><br>
            {% csrf_token %}

            {{ form.as_p }}


            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Course
                </button>

                <a href="{% url 'course_list' %}" class="back-btn">
                    Back
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
