<!DOCTYPE html>
<html>
<head>
    <title>Enrollment Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
        }

        .detail {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #eee;
        }

        .label {
            font-weight: bold;
            color: #555;
        }

        .value {
            color: #222;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            text-align: center;
            padding: 11px;
            text-decoration: none;
            border-radius: 6px;
            color: white;
        }

        .back {
            background: #555;
        }

        .edit {
            background: #2563eb;
        }

        .delete {
            background: #dc2626;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Enrollment Details</h1>

        <div class="detail">
            <span class="label">Student</span>
            <span class="value">
                {{ enrollment.student.name }}
            </span>
        </div>

        <div class="detail">
            <span class="label">Course</span>
            <span class="value">
                {{ enrollment.course.name }}
            </span>
        </div>

        <div class="detail">
            <span class="label">Enrollment Date</span>
            <span class="value">
                {{ enrollment.enrollment_date }}
            </span>
        </div>

        <div class="detail">
            <span class="label">Status</span>
            <span class="value">
                {{ enrollment.status }}
            </span>
        </div>

        <div class="detail">
            <span class="label">Marks</span>
            <span class="value">
                {{ enrollment.marks }}
            </span>
        </div>

        <div class="buttons">

            <a href="{% url 'enrollment_list' %}"
               class="btn back">
                Back
            </a>

            <a href="{% url 'enrollment_update' enrollment.id %}"
               class="btn edit">
                Edit
            </a>

            <a href="{% url 'enrollment_delete' enrollment.id %}"
               class="btn delete">
                Delete
            </a>

        </div>

    </div>

</div>

</body>
</html>
