<!DOCTYPE html>
<html>
<head>
    <title>Enrollment Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
           
        }

        .container {
            max-width: 550px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        form p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #2563eb;
        }
        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button,
        .back-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 7px;
            font-size: 15px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        .save-btn {
            background: #4f46e5;
            color: white;
        }

        .save-btn:hover {
            background: #3730a3;
        }

        .back-btn {
            background: #e5e7eb;
            color: #333;
        }

        .back-btn:hover {
            background: #d1d5db;
        }
        
        </style>
</head>

<body>

    {% include 'base.html'%}

<div class="container">

    <div class="card">

        <h1>Enrollment</h1>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}
            <div class="buttons">

                <button type="submit" class="save-btn">
                    Save Enrollment
                </button>

            <a href="{% url 'enrollment_list' %}"
                class="back-btn">
                    Back to Enrollments
            </a>
            </div>

        </form>

        

    </div>

</div>

</body>
</html>
