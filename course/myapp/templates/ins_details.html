<!DOCTYPE html>
<html>
<head>
    <title>Instructor Form</title>

    <style>
        body {
            font-family: Arial;
            background: #f3f4f6;
            padding: 40px;
        }

        .box {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input[type="file"] {
            padding: 10px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        button,
        a {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-size: 15px;
        }

        button {
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        a {
            background: #ddd;
            color: black;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Instructor Form</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        <div class="group">
            <label>Instructor Name</label>
            <input
                type="text"
                name="name"
                placeholder="Enter instructor name"
                value="{{ instructor.name|default:'' }}"
                required
            >
        </div>

        <div class="group">
            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter email"
                value="{{ instructor.email|default:'' }}"
                required
            >
        </div>

        <div class="group">
            <label>Specialization</label>
            <input
                type="text"
                name="specialization"
                placeholder="Enter specialization"
                value="{{ instructor.specialization|default:'' }}"
                required
            >
        </div>

        <div class="group">
            <label>Profile Image</label>
            <input
                type="file"
                name="profile_img"
            >
        </div>

        <div class="buttons">

            <button type="submit">
                Save Instructor
            </button>

            <a href="{% url 'instructor_list' %}">
                Back
            </a>

        </div>

    </form>

</div>

</body>
</html>
