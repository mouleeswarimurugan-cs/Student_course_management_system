<!DOCTYPE html>
<html>

<head>

    <title>Delete Course Material</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .delete-card {
            width: 100%;
            max-width: 500px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            text-align: center;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #fee2e2;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 32px;
        }

        h1 {
            color: #17294b;

            margin-bottom: 15px;
        }

        .message {
            color: #666;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .material-name {
            color: #17294b;

            font-weight: bold;
        }

        .course-name {
            color: #555;

            font-weight: bold;
        }

        .buttons {
            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        .btn {
            flex: 1;

            padding: 12px;

            border: none;

            border-radius: 7px;

            text-decoration: none;

            text-align: center;

            font-size: 15px;

            cursor: pointer;
        }

        .delete-btn {
            background: #dc3545;

            color: white;
        }

        .delete-btn:hover {
            background: #b02a37;
        }

        .cancel-btn {
            background: #e5e7eb;

            color: #333;
        }

        .cancel-btn:hover {
            background: #d1d5db;
        }

        .file-info {
            background: #f5f7fa;

            padding: 12px;

            border-radius: 7px;

            margin-top: 15px;

            font-size: 14px;

            color: #666;
        }

        @media (max-width: 500px) {

            .delete-card {
                padding: 25px 20px;
            }

            .buttons {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>


<div class="delete-card">


    <div class="icon">
        ⚠️
    </div>


    <h1>
        Delete Course Material?
    </h1>


    <p class="message">

        Are you sure you want to delete

        <span class="material-name">
            "{{ material.title }}"
        </span>

        from

        <span class="course-name">
            {{ material.course.name }}
        </span>?

        <br>

        This action cannot be undone.

    </p>


    {% if material.file %}

        <div class="file-info">

            File:

            {{ material.file.name }}

        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <div class="buttons">


            <button
                type="submit"
                class="btn delete-btn">

                Yes, Delete

            </button>


            <a
                href="{% url 'material_list' %}"
                class="btn cancel-btn">

                Cancel

            </a>


        </div>

    </form>


</div>


</body>

</html>
