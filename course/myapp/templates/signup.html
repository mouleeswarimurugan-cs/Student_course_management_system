<!DOCTYPE html>
<html>

<head>

    <title>Sign Up</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f7f2;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .signup-box {
            width: 400px;

            background: white;

            padding: 35px;

            border: 1px solid #ddd5c5;

            border-radius: 8px;
        }

        h1 {
            text-align: center;

            color: #1c2d4d;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            color: #34445d;
        }

        input {
            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #d5d5d5;

            border-radius: 5px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 13px;

            background: #1c2d4d;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #2d4265;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            font-size: 13px;
        }

        .login-link a {
            color: #1c2d4d;

            font-weight: bold;

            text-decoration: none;
        }

        .message {
            background: #fce8e8;

            color: #b42318;

            padding: 10px;

            margin-bottom: 15px;

            border-radius: 5px;

            font-size: 13px;
        }

    </style>

</head>

<body>


<div class="signup-box">

    <h1>Create Account</h1>

    <div class="subtitle">
        Student Course Management System
    </div>


    {% if messages %}

        {% for message in messages %}

            <div class="message">
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            required
        >


        <button type="submit">
            Sign Up
        </button>

    </form>


    <div class="login-link">

        Already have an account?

        <a href="{% url 'login' %}">
            Login
        </a>

    </div>

</div>


</body>

</html>
